<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>צ'אט בוט - משימה 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-box">
        <div class="orange-header">צ'אט בוט  </div>
        
        <div class="message-list" id="myBox">
            <p><strong>בוט:</strong> שלום, במה אפשר לעזור היום?</p>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="הקלד הודעה כאן...">
            <button id="sendBtn">שלח</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
